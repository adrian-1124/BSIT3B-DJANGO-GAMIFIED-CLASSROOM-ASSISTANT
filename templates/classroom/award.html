{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <h2 class="page-title mb-3">Award / Deduct Points</h2>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Student</label>
        <select name="student" class="form-select" required>
          {% for s in students %}
          <option value="{{ s.pk }}">{{ s.user.username }} ({{ s.points }} pts)</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Points (use negative to deduct)</label>
        <input type="number" name="delta" class="form-control" value="10" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Reason</label>
        <input type="text" name="reason" class="form-control" placeholder="e.g. Great participation">
      </div>
      <button class="btn btn-primary">Apply</button>
    </form>
  </div></div>
</div>
{% endblock %}
