{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <h2 class="page-title mb-3">{{ quiz.title }}</h2>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      {% for q in questions %}
      <div class="mb-3">
        <label class="form-label"><strong>{{ forloop.counter }}.</strong> {{ q.text }}</label>
        <input type="text" name="q_{{ q.id }}" class="form-control" required>
      </div>
      {% endfor %}
      <button class="btn btn-primary">Submit</button>
    </form>
  </div></div>
</div>
{% endblock %}
