{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <h2 class="page-title mb-3">AI Quiz Generator</h2>
  <div class="card"><div class="card-body">
    <p class="text-muted">Automatically builds a quiz with ready-made questions and answers.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Generate Quiz</button>
    </form>
  </div></div>
</div>
{% endblock %}
