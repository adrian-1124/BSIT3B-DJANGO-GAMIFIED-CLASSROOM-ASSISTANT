{% extends "theme/base.html" %}
{% block content %}
  <h2 class="page-title mb-3">Attendance</h2>
  <div class="card mb-3"><div class="card-body">
    <form method="get" class="row g-3 align-items-end">
      <div class="col-md-8">
        <label class="form-label">Classroom</label>
        <select name="classroom" class="form-select" onchange="this.form.submit()">
          {% for c in classrooms %}
          <option value="{{ c.pk }}" {% if selected and c.pk == selected.pk %}selected{% endif %}>{{ c }}</option>
          {% endfor %}
        </select>
      </div>
    </form>
  </div></div>
  <div class="card"><div class="card-body">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="classroom" value="{{ selected.pk }}">
      <div class="mb-3">
        <label class="form-label">Date</label>
        <input type="date" name="date" class="form-control" style="max-width: 220px;" value="{{ today|date:'Y-m-d' }}">
      </div>
      <table class="table table-responsive" style="width:100%;">
        <thead><tr><th style="width:200px;">Student</th><th>Status</th></tr></thead>
        <tbody>
          {% for s in students %}
          <tr>
            <td>{{ s.user.username }}</td>
            <td>
              <div class="d-flex flex-wrap gap-3" data-status-group="status_{{ s.user_id }}">
                <label class="form-check"><input type="checkbox" class="form-check-input status-check" name="status_{{ s.user_id }}" value="present"> Present (+5)</label>
                <label class="form-check"><input type="checkbox" class="form-check-input status-check" name="status_{{ s.user_id }}" value="late"> Late (+2)</label>
                <label class="form-check"><input type="checkbox" class="form-check-input status-check" name="status_{{ s.user_id }}" value="excused"> Excused</label>
                <label class="form-check"><input type="checkbox" class="form-check-input status-check" name="status_{{ s.user_id }}" value="absent"> Absent</label>
              </div>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="2" class="text-muted">No students enrolled in this class.</td></tr>
          {% endfor %}
        </tbody>
      </table>
      <button class="btn btn-primary" {% if not students %}disabled{% endif %}>Save Attendance</button>
    </form>
  </div></div>
<script>
  document.querySelectorAll('[data-status-group]').forEach(function (group) {
    group.addEventListener('change', function (e) {
      if (e.target.classList.contains('status-check') && e.target.checked) {
        group.querySelectorAll('.status-check').forEach(function (cb) {
          if (cb !== e.target) cb.checked = false;
        });
      }
    });
  });
</script>
{% endblock %}
