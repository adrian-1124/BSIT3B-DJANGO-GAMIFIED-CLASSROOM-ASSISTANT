{% extends "theme/base.html" %}
{% block content %}
<div class="container-xl">
  <div class="page-header d-print-none" aria-label="Page header">
    <div class="container-xl">
      <div class="row align-items-center">
        <div class="col">
          <div class="page-pretitle">Overview</div>
          <div class="d-flex align-items-center gap-3 flex-wrap d-none d-md-flex">
            <h2 class="page-title mb-0">Dashboard</h2>
          </div>
          <h2 class="page-title mb-0 d-md-none">Dashboard</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-3">

  <div class="row row-cards">

      <a class="card card-link" href="{% url 'classroom:dashboard' %}">

        <div class="card-body"><i class="fa fa-question-circle text-green me-2"></i> Quizzes</div>

    </div>
    <div class="col-md-3">
      <a class="card card-link" href="{% url 'classroom:rewards' %}">
        <div class="card-body"><i class="fa fa-gift text-red me-2"></i> Rewards</div>
